name: build-ios

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ios.yml"
      - "app.json"
      - "app.config.ts"
      - "package.json"
      - "package-lock.json"
      - "babel.config.js"
      - "metro.config.js"
      - "tsconfig.json"
      - "src/**"
      - "assets/**"
    tags:
      - "v*"

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npm ci

      - name: Type check
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx tsc --noEmit

      - name: Expo prebuild (iOS)
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Detect Xcode scheme
        id: scheme
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          BASE=$(basename "$WS" .xcworkspace)
          LIST=$(xcodebuild -list -json -workspace "$WS")
          SCHEME=$(printf '%s' "$LIST" | python3 -c "
            import sys, json
            base = sys.argv[1]
            ss = json.load(sys.stdin)['workspace']['schemes']
            cand = ([s for s in ss if s == base]
                    or [s for s in ss if not s.startswith('Pods')])
            print(cand[0])" "$BASE")
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Detected scheme: $SCHEME"

      - name: Build unsigned .app (device)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP_PATH" || { echo "No .app produced"; exit 1; }
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          rm -f Drama.ipa
          zip -qry Drama.ipa Payload
          unzip -l Drama.ipa | head -8
          ls -lh Drama.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drama-unsigned-ipa
          path: Drama.ipa
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ios-build-{0}', github.run_number) }}"
          name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('iOS build run {0}', github.run_number) }}"
          body: |
            未签名 IPA（TrollStore 安装）：下载 `Drama.ipa` → 手机浏览器/文件 App 打开 → 用 TrollStore 导入安装。

            构建来源：${{ github.event_name }} · commit ${{ github.sha }}
          files: Drama.ipa

      - name: On failure - publish log to ci-logs branch
        if: failure()
        run: |
          {
            echo "run: ${{ github.run_number }}  event: ${{ github.event_name }}  commit: ${{ github.sha }}"
            echo
            if [ -f xcodebuild.log ]; then
              echo "=== xcodebuild.log (tail 400) ==="
              tail -n 400 xcodebuild.log
            else
              echo "=== xcodebuild.log 不存在（在更早的步骤失败）==="
            fi
            echo
            echo "=== tsc ==="
            npx tsc --noEmit 2>&1 | tail -n 80 || true
            echo
            echo "=== prebuild ==="
            npx expo prebuild --platform ios --no-install --clean 2>&1 | tail -n 40 || true
          } > latest.log
          git config user.name "ci-log-bot"
          git config user.email "actions@github.com"
          git checkout -B ci-logs
          git add -f latest.log
          git commit -m "ci log: run ${{ github.run_number }}" || true
          git push --force origin ci-logs
